<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" role="img" aria-label="Ordem Paranormal">
  <!-- Minimal wordmark + occult mark inspired by Ordem Paranormal visual language -->
  <g transform="translate(8,8)">
    <circle cx="28" cy="28" r="26" stroke="#e8e4dc" stroke-width="1.5" opacity="0.85"/>
    <circle cx="28" cy="28" r="18" stroke="#e8e4dc" stroke-width="1" opacity="0.45"/>
    <!-- hexagram / occult star -->
    <path d="M28 8 L34 22 L48 24 L37 34 L41 48 L28 40 L15 48 L19 34 L8 24 L22 22 Z"
          fill="none" stroke="#e8e4dc" stroke-width="1.25" stroke-linejoin="round" opacity="0.95"/>
    <!-- inner eye -->
    <ellipse cx="28" cy="28" rx="7" ry="4.2" stroke="#c62828" stroke-width="1.4" fill="none"/>
    <circle cx="28" cy="28" r="2.1" fill="#c62828"/>
  </g>
  <g fill="#e8e4dc" font-family="Cinzel, 'Times New Roman', serif" letter-spacing="0.18em">
    <text x="78" y="30" font-size="15" font-weight="700">ORDEM</text>
    <text x="78" y="52" font-size="15" font-weight="700">PARANORMAL</text>
  </g>
  <line x1="78" y1="36" x2="250" y2="36" stroke="#c62828" stroke-width="1" opacity="0.7"/>
</svg>
